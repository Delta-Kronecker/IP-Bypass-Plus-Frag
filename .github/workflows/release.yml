name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Windows x64
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package Windows release
        run: |
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-gnu/release/ip-bypass-plus-frag.exe dist/windows/
          cp WinDivert_WinDivert64/WinDivert.dll dist/windows/
          cp WinDivert_WinDivert64/WinDivert64.sys dist/windows/
          cp config.toml dist/windows/
          cp ip_list.txt dist/windows/
          cp TermuxSetup.sh dist/windows/
          cd dist
          zip -r ../ip-bypass-plus-frag-windows-x64.zip windows/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ip-bypass-plus-frag-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, musl + android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl,aarch64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Android aarch64 (shared library)
        env:
          CC_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          AR_aarch64_linux_android: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
        run: |
          cargo build --release --target aarch64-linux-android --lib --no-default-features

      - name: Build Termux aarch64 (static binary)
        run: |
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Package Android shared library
        run: |
          mkdir -p dist/android
          cp target/aarch64-linux-android/release/libip_bypass_plus_frag.so dist/android/
          cp config.toml dist/android/config.toml.default
          cp ip_list.txt dist/android/ip_list.default.txt
          cp crates/ip-bypass-plus-frag/include/ipbp.h dist/android/
          cd dist
          tar czf ../ip-bypass-plus-frag-android-aarch64.tar.gz android/

      - name: Package Termux binary
        run: |
          mkdir -p dist/termux
          cp target/aarch64-unknown-linux-musl/release/ip-bypass-plus-frag dist/termux/
          cp config.toml dist/termux/
          cp ip_list.txt dist/termux/
          cp TermuxSetup.sh dist/termux/
          cd dist
          tar czf ../ip-bypass-plus-frag-termux.tar.gz termux/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aarch64
          path: ip-bypass-plus-frag-android-aarch64.tar.gz

      - name: Upload Termux artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-aarch64
          path: ip-bypass-plus-frag-termux.tar.gz

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            windows-x64/ip-bypass-plus-frag-windows-x64.zip
            android-aarch64/ip-bypass-plus-frag-android-aarch64.tar.gz
            termux-aarch64/ip-bypass-plus-frag-termux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
